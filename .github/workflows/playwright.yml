# .github/workflows/playwright.yml
# ─────────────────────────────────────────────────────────────
# GitHub Actions CI pipeline for Amazon Playwright Automation.
#
# Triggers:
#   • Every push to main / master
#   • Every pull request targeting main / master
#   • Manual trigger via GitHub UI (workflow_dispatch)
#
# Jobs:
#   1. test-local    → runs TC01 + TC02 in parallel on GitHub runner
#   2. test-cloud    → runs TC01 + TC02 on LambdaTest (requires secrets)
# ─────────────────────────────────────────────────────────────

name: Playwright Automation — Amazon Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cloud:
    name: Run Tests (Local Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Tests on LambdaTest
        run: npm run test:lt
        env:
          BASE_URL: https://www.amazon.in
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          LT_BUILD_NAME: "GH Actions Build ${{ github.run_number }}"
          USE_LAMBDATEST: "true"
          CI: "true"

      - name: Upload LamdaTest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lt-report-${{ github.run_number }} 
          path: reports/lt-report
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results
          retention-days: 7

  